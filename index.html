<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mattor" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Körrutter för tidtagningsmattor. HBGM 26 inbyggt. Egna lopp, grupper och punkter." />
  <title>Mattor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111824;
      --line: #2a3440;
      --text: #f4f7fb;
      --muted: #9aa6b4;
      --soder: #f59e0b;
      --mitten: #3b82f6;
      --norr: #10b981;
      --accent: #3b82f6;
      --header-h: calc(52px + env(safe-area-inset-top));
      --sheet: min(46dvh, 380px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: manipulation;
    }
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
      background: linear-gradient(to bottom, rgba(11,18,32,.94), rgba(11,18,32,.45) 78%, transparent);
    }
    .groups { display: flex; flex: 1; gap: 6px; min-width: 0; overflow-x: auto; }
    .groups button {
      flex: 1 0 auto;
      min-width: 70px;
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      background: rgba(16,22,28,.9);
      color: var(--text);
      font-weight: 800;
      font-size: 0.95rem;
      box-shadow: 0 1px 6px rgba(0,0,0,.28);
    }
    .groups button[aria-pressed="true"] { color: #0b1220; }
    .icon-btn {
      width: 44px; height: 44px; flex: none;
      border: 0; border-radius: 12px;
      background: rgba(16,22,28,.9);
      color: var(--text);
      display: grid; place-items: center;
      box-shadow: 0 1px 6px rgba(0,0,0,.28);
    }
    #map {
      position: absolute;
      inset: 0 0 var(--sheet) 0;
      background: var(--bg);
    }
    .leaflet-control-attribution {
      max-width: 46vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 10px !important;
    }
    .leaflet-bottom.leaflet-right { margin-bottom: 8px; }
    .sheet {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: var(--sheet);
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      z-index: 400;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -8px 24px rgba(0,0,0,.28);
    }
    .handle {
      width: 42px; height: 4px; border-radius: 99px;
      background: #3a4553; margin: 8px auto 2px;
      flex: none;
    }
    .modes {
      display: flex;
      gap: 6px;
      padding: 2px 12px 8px;
      flex: none;
    }
    .modes button {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #10161c;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.82rem;
    }
    .modes button[aria-pressed="true"] {
      background: var(--accent);
      color: #0b1220;
      border-color: transparent;
    }
    .now {
      padding: 6px 14px 12px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    .now-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .now h2 {
      margin: 0;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .now p { margin: 4px 0 0; color: var(--muted); font-size: 0.8rem; }
    .nav-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 14px; border-radius: 12px;
      background: var(--accent); color: #0b1220;
      font-weight: 800; text-decoration: none; flex: none;
      font-size: 0.95rem;
    }
    .list {
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 12px 18px;
      flex: 1;
    }
    .who { color: var(--muted); font-size: 0.78rem; margin: 0 2px 10px; }
    .stop {
      background: #10161c;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .stop.is-on {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 38%, transparent);
    }
    .stop.is-done { background: #0e1a14; }
    .stop.is-done h3 { color: var(--muted); }
    .stop-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .stop h3 {
      margin: 0 0 4px;
      font-size: 0.95rem;
      display: flex; gap: 8px; align-items: center;
      flex: 1;
      min-width: 0;
    }
    .been {
      width: 44px; height: 44px; flex: none;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #10161c;
      color: var(--muted);
      display: grid; place-items: center;
      padding: 0;
    }
    .been svg { width: 22px; height: 22px; }
    .been[aria-pressed="true"] {
      background: #22c55e;
      border-color: #22c55e;
      color: #052e16;
    }
    .num {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; color: #0b1220; flex: none;
    }
    .times { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
    .times strong { color: var(--text); }
    .note { font-size: 0.85rem; margin-top: 4px; }
    .note.warn { background: #3a2a08; color: #fde68a; padding: 8px 10px; border-radius: 8px; margin-top: 8px; }
    .leg { color: var(--muted); font-size: 0.72rem; margin: 0 4px 8px; }
    .toast {
      position: fixed; left: 50%; top: calc(var(--header-h) + 8px);
      transform: translateX(-50%);
      background: #e8eef4; color: #0b1220;
      padding: 10px 14px; border-radius: 999px;
      font-weight: 700; z-index: 800; display: none;
      white-space: nowrap;
    }
    .mk-num {
      width: 34px; height: 34px; border-radius: 50%;
      color: #0b1220; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.4);
      font-size: 15px;
    }
    .mk.is-on .mk-num {
      width: 42px; height: 42px; border-width: 3px;
      box-shadow: 0 0 0 4px rgba(255,255,255,.28);
    }
    .mk.is-done .mk-num { background: #22c55e !important; }
    .mk-num svg { width: 18px; height: 18px; display: block; }
    .more {
      position: absolute; right: 10px; top: calc(var(--header-h) + 4px);
      z-index: 450; display: none;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 6px; min-width: 190px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .more a, .more button {
      display: block; width: 100%; text-align: left;
      background: none; border: 0; color: var(--text);
      padding: 12px; font-weight: 700; text-decoration: none;
      font-size: 0.95rem;
    }
    @media (max-width: 859px) and (orientation: landscape) {
      :root { --sheet: 0px; }
      #map { inset: 0 42% 0 0; }
      .sheet {
        left: 58%; width: 42%; height: auto; top: 0; bottom: 0;
        border-radius: 0; border-left: 1px solid var(--line); border-top: 0;
        box-shadow: none;
      }
      .handle { display: none; }
      header { right: 42%; }
    }
    /* Desktop only when it is actually a pointer device — phones that
       report ~980px width would otherwise get the two-column layout. */
    @media (min-width: 860px) and (hover: hover) and (pointer: fine) {
      :root { --sheet: 0px; --header-h: 60px; }
      header {
        position: static;
        background: #111824;
        padding: 8px 16px;
      }
      #map {
        position: absolute;
        top: 60px; left: 380px; right: 0; bottom: 0;
      }
      .sheet {
        position: absolute;
        top: 60px; left: 0; width: 380px; height: auto; bottom: 0;
        border-radius: 0; border-right: 1px solid var(--line); border-top: 0;
        box-shadow: none;
      }
      .handle { display: none; }
    }
    .editor {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: min(72dvh, 560px);
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      z-index: 430;
      display: none;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -8px 24px rgba(0,0,0,.28);
    }
    .editor.open { display: flex; }
    .editor-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none;
    }
    .editor-head h2 { margin: 0; font-size: 1rem; flex: 1; }
    .editor-body {
      overflow: auto; -webkit-overflow-scrolling: touch;
      padding: 12px; flex: 1;
    }
    .editor label { display: block; color: var(--muted); font-size: 0.75rem; font-weight: 700; margin: 10px 0 4px; }
    .editor input, .editor textarea, .editor select {
      width: 100%; background: #10161c; color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font: inherit;
    }
    .editor textarea { min-height: 64px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    .edit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .edit-actions button, .btn {
      min-height: 40px; border: 0; border-radius: 10px;
      background: #1c2530; color: var(--text); font-weight: 800; padding: 0 12px;
    }
    .btn-accent { background: var(--accent); color: #0b1220; }
    .btn-danger { background: #7f1d1d; }
    .pt-card {
      background: #10161c; border: 1px solid var(--line);
      border-radius: 12px; padding: 10px; margin-bottom: 8px;
    }
    .pt-card.is-edit { border-color: var(--edit-color, var(--accent)); box-shadow: 0 0 0 1px var(--edit-color, var(--accent)); }
    .edit-block {
      border: 2px solid var(--edit-color, var(--accent));
      border-radius: 14px;
      padding: 8px 12px 12px;
      margin-top: 4px;
      background: #10161c;
    }
    #teamChips { margin-top: 12px; }
    .time-pick {
      display: flex; align-items: center; gap: 8px;
      margin: 0 0 4px;
    }
    .time-pick select {
      flex: 1; min-height: 48px;
      font-size: 1.25rem; font-weight: 800;
      text-align: center;
    }
    .time-pick span {
      font-size: 1.35rem; font-weight: 800; color: var(--muted);
    }
    .pick-banner {
      display: none; position: absolute; left: 50%; top: calc(var(--header-h) + 8px);
      transform: translateX(-50%); z-index: 520;
      background: #fde68a; color: #0b1220; font-weight: 800;
      padding: 10px 14px; border-radius: 999px; white-space: nowrap;
    }
    .pick-banner.on { display: block; }
    .busy {
      display: none; position: fixed; inset: 0; z-index: 900;
      background: rgba(11,18,32,.72);
      align-items: center; justify-content: center;
      color: var(--text); font-weight: 800;
    }
    .busy.on { display: flex; }
    @media (max-width: 859px) and (orientation: landscape) {
      .editor { left: 58%; width: 42%; height: auto; top: 0; border-radius: 0; border-left: 1px solid var(--line); border-top: 0; }
    }
    .chooser {
      display: none;
      position: fixed; inset: 0; z-index: 860;
      background: var(--bg);
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      overflow: auto;
      flex-direction: column;
    }
    .chooser.open { display: flex; }
    .chooser h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .chooser p { color: var(--muted); margin: 0 0 20px; }
    .chooser-item {
      width: 100%; text-align: left;
      min-height: 64px; margin-bottom: 10px;
      border: 1px solid var(--line); border-radius: 14px;
      background: #10161c; color: var(--text);
      padding: 14px 16px; font: inherit;
    }
    .chooser-item strong { display: block; font-size: 1.15rem; }
    .chooser-item span { display: block; color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .chooser .edit-actions { margin-top: 8px; }
    body.view-only .admin-only { display: none !important; }
    body.view-only .editor { display: none !important; }
    body.view-only .chooser { display: none !important; }
    body.editing { --sheet: min(72dvh, 560px); }
    body.editing .sheet { display: none !important; }
    @media (max-width: 859px) and (orientation: landscape) {
      body.editing { --sheet: 0px; }
    }
    @media (min-width: 860px) and (hover: hover) and (pointer: fine) {
      .editor {
        top: 60px; left: 0; width: 380px; height: auto; right: auto;
        border-radius: 0; border-right: 1px solid var(--line); border-top: 0;
      }
      body.editing { --sheet: 0px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="groups" id="groups"></div>
    <button type="button" class="icon-btn" id="share" aria-label="Kopiera länk" title="Kopiera länk">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
      </svg>
    </button>
    <button type="button" class="icon-btn" id="moreBtn" aria-label="Mer" title="Mer">···</button>
  </header>
  <div id="map"></div>
  <div class="more" id="more">
    <a id="gmaps" target="_blank" rel="noopener">Hela rutten i Maps</a>
    <button type="button" id="gpxBtn">Ladda ner GPX</button>
    <button type="button" id="clearDone">Rensa avbockning</button>
    <button type="button" class="admin-only" id="switchEventBtn">Byt lopp</button>
    <button type="button" class="admin-only" id="newEventBtn">Nytt lopp</button>
    <button type="button" class="admin-only" id="editBtn">Redigera lopp</button>
    <button type="button" class="admin-only" id="exportBtn">Spara lopp som fil</button>
    <button type="button" class="admin-only" id="importBtn">Öppna lopp från fil</button>
  </div>
  <section class="sheet">
    <div class="handle"></div>
    <div class="modes" id="modes">
      <button type="button" data-mode="kortast" aria-pressed="true">Kortast körväg</button>
      <button type="button" data-mode="iga">Igång-tid</button>
    </div>
    <div class="now" id="now"></div>
    <div class="list" id="sidebar"></div>
  </section>
  <section class="editor" id="editor">
    <div class="editor-head">
      <h2>Redigera lopp</h2>
      <button type="button" class="btn btn-accent" id="editorDone">Klar</button>
    </div>
    <div class="editor-body" id="editorBody"></div>
  </section>
  <section class="chooser" id="chooser" aria-label="Välj lopp">
    <h1>Välj lopp</h1>
    <p>Vilket lopp vill du öppna?</p>
    <div id="chooserList"></div>
    <div class="edit-actions">
      <button type="button" class="btn btn-accent" id="chooserNew">Nytt lopp</button>
      <button type="button" class="btn" id="chooserCancel">Avbryt</button>
    </div>
  </section>
  <div class="pick-banner" id="pickBanner">Tryck på kartan för att sätta punkten</div>
  <div class="busy" id="busy"><span id="busyText">Beräknar körväg…</span></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />
  <div class="toast" id="toast">Länk kopierad</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=12"></script>
  <script src="routes.js?v=8"></script>
  <script src="ui.js?v=14"></script>
</body>
</html>
